# Configuration de test : base H2 en mémoire (mode PostgreSQL), isolée de DBPRS20.
# Ce fichier (classpath de test) remplace celui de src/main/resources pour les tests.
spring.application.name=prs-test

# INIT crée un domaine "text" (cité) car globally_quoted_identifiers cite aussi le type
# de colonne `columnDefinition="text"` — type natif de PostgreSQL, absent de H2.
# INIT crée aussi les séquences d'allocation de PK (Voie B) — équivalent H2 des migrations Postgres
# de docs/migrations/. En production chaque séquence est positionnée sur max(id)+1 de SA table ; ici
# les START sont des constantes hautes, distinctes par table, choisies au-dessus du plus grand id
# semé par les tests (les fixtures vont jusqu'à ~8000) : un id rendu par la séquence est donc
# reconnaissable à l'œil, et une PK devinée par un test ne peut pas entrer en collision avec elle.
spring.datasource.url=jdbc:h2:mem:prstest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS "text" AS VARCHAR\\;CREATE DOMAIN IF NOT EXISTS "bytea" AS BINARY VARYING(10485760)\\;CREATE SEQUENCE IF NOT EXISTS seq_dossier START WITH 100001\\;CREATE SEQUENCE IF NOT EXISTS seq_ppm START WITH 200001\\;CREATE SEQUENCE IF NOT EXISTS seq_marche START WITH 300001\\;CREATE SEQUENCE IF NOT EXISTS seq_reception START WITH 1100001\\;CREATE SEQUENCE IF NOT EXISTS seq_audit_log START WITH 400001\\;CREATE SEQUENCE IF NOT EXISTS seq_notification START WITH 500001\\;CREATE SEQUENCE IF NOT EXISTS seq_lot START WITH 600001\\;CREATE SEQUENCE IF NOT EXISTS seq_service_beneficiaire START WITH 700001\\;CREATE SEQUENCE IF NOT EXISTS seq_marche_prevision START WITH 800001\\;CREATE SEQUENCE IF NOT EXISTS seq_tranche START WITH 900001\\;CREATE SEQUENCE IF NOT EXISTS seq_message START WITH 1200001\\;CREATE SEQUENCE IF NOT EXISTS seq_piece_jointe START WITH 1300001\\;CREATE SEQUENCE IF NOT EXISTS seq_pv_examen START WITH 1400001\\;CREATE SEQUENCE IF NOT EXISTS seq_pv_navette START WITH 1500001\\;CREATE SEQUENCE IF NOT EXISTS seq_prmp_entite START WITH 1600001\\;CREATE SEQUENCE IF NOT EXISTS seq_entite_contract START WITH 1700001\\;CREATE SEQUENCE IF NOT EXISTS seq_prmp_entite_demande START WITH 1800001\\;CREATE SEQUENCE IF NOT EXISTS seq_changement_ligne START WITH 1900001
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Mêmes identifiants cités qu'en prod (colonnes MAJUSCULES) pour rester cohérent.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Secret JWT de test (>= 32 octets).
app.jwt.secret=test-secret-please-change-0123456789-abcdefghij
app.jwt.expiration-seconds=3600

# Cookie de session : meme comportement qu'en prod (phase 3 — jeton absent du corps de login),
# pour que la suite teste le contrat reel. Ce fichier REMPLACE celui de main : sans cette ligne,
# les tests retomberaient sur le defaut exclusif=false du code.
app.auth.cookie.exclusif=true

# Pas de seed automatique en test (les fixtures sont créées par les tests).
app.seed.comptes.enabled=false

# Pas de prechauffage Word en test : la suite ne doit pas lancer Word au demarrage du contexte.
app.pv.document.prechauffage=false
app.lettre-renvoi.document.prechauffage=false
