# Configuration de test : PostgreSQL 17 reel dans un conteneur jetable (Testcontainers),
# schema rejoue par Flyway (V1 baseline + reprises) — ADR-0004, 2026-08-26.
# Ce fichier (classpath de test) remplace celui de src/main/resources pour les tests.
# La connexion (url / user / password) est injectee par AbstractIntegrationTest
# (@DynamicPropertySource) depuis le conteneur — ne PAS la definir ici.
spring.application.name=prs-test

# Hibernate ne cree plus rien : Flyway construit le schema (V1 -> V4), Hibernate le VERIFIE.
# Les tests valident donc le schema PostgreSQL reel (contraintes CHECK, sequences, types),
# ce que l'ancienne base H2 (create-drop + domaines de compatibilite) ne faisait pas.
spring.jpa.hibernate.ddl-auto=validate
# Memes identifiants cites qu'en prod (colonnes MAJUSCULES) pour rester coherent.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Secret JWT de test (>= 32 octets) — obligatoire depuis le durcissement fail-fast (LOT 0).
app.jwt.secret=test-secret-please-change-0123456789-abcdefghij
app.jwt.expiration-seconds=3600

# Cookie de session : meme comportement qu'en prod (phase 3 — jeton absent du corps de login),
# pour que la suite teste le contrat reel. Ce fichier REMPLACE celui de main : sans cette ligne,
# les tests retomberaient sur le defaut exclusif=false du code.
app.auth.cookie.exclusif=true

# Pas de seed automatique en test (les fixtures sont creees par les tests).
app.seed.comptes.enabled=false

# Pas de prechauffage Word en test : la suite ne doit pas lancer Word au demarrage du contexte.
app.pv.document.prechauffage=false
