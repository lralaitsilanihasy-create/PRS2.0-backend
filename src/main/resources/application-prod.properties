# Profil « prod » — a activer au deploiement : -Dspring.profiles.active=prod
# (ou SPRING_PROFILES_ACTIVE=prod).
#
# Role de ce fichier : transformer en ECHEC AU DEMARRAGE ce qui, sinon, passe silencieusement
# en production avec les valeurs de developpement versionnees dans application.properties.
# Les placeholders ci-dessous n'ont VOLONTAIREMENT pas de valeur de repli : si la variable
# d'environnement est absente, Spring refuse de construire le contexte et le dit clairement,
# au lieu de demarrer avec un secret publiquement lisible dans le depot.

# --- Secrets exiges (aucun repli) ---
# Secret HMAC HS256, >= 32 octets. Generer une valeur aleatoire propre a l'environnement,
# ex. : openssl rand -base64 48
app.jwt.secret=${APP_JWT_SECRET}
# Mot de passe du compte PostgreSQL applicatif.
spring.datasource.password=${DB_PASSWORD}

# --- Garde-fous de production ---
# Jamais de seed de comptes hors developpement (mots de passe communs).
app.seed.comptes.enabled=false
# Pas de trace SQL : volume de logs et fuite de donnees metier.
spring.jpa.show-sql=false
