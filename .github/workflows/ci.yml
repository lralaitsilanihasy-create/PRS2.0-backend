# CI backend — chaque poussée et chaque pull request : compilation + suite de tests.
# Sans cela, les 444 tests du dépôt ne s'exécutaient que manuellement (plan de
# travaux 2026-08-26, LOT 0 ; modèle : CI du dépôt Collegue).
#
# Les tests tagués « word » (génération du PV via MS Word / documents4j) sont exclus :
# les runners GitHub n'ont pas Word. Ils restent exécutés en local (mvnw test).
name: CI

on:
  push:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests Maven
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests (hors groupe « word »)
        run: ./mvnw --batch-mode test -DexcludedGroups=word
        env:
          # Secret de test explicite (>= 32 octets) : l'application refuse de
          # démarrer sans secret depuis le durcissement du 2026-08-26.
          APP_JWT_SECRET: ci-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          # ⚠️ 2026-08-28 — la surcharge PRS_TEST_PG_IMAGE a été RETIRÉE. La production tourne en
          # PostgreSQL 18 (confirmé par le pilote), et c'est désormais le défaut d'AbstractIntegrationTest :
          # la CI teste la version de production sans avoir à la redéclarer ici.
          # Une version écrite à deux endroits finit toujours par diverger — c'est précisément ce qui
          # venait d'arriver entre le socle (17), l'ADR-0004 (16 dans son titre, 17 dans son
          # aboutissement) et cette ligne (18). Un seul point de vérité, désormais.

      # ⚠️ 2026-08-28 — sans jeton, les logs d'un run ne sont pas téléchargeables (403) et les
      # annotations de surefire ne portent que le message d'exception, jamais le nom du test. On
      # republie donc les échecs en commandes « ::error:: », qui, elles, deviennent des annotations
      # lisibles par l'API publique. Diagnostiquer un échec de CI ne doit pas exiger un secret.
      - name: Tests en échec — noms lisibles depuis l'API
        if: failure()
        run: |
          shopt -s nullglob
          trouve=0
          for f in target/surefire-reports/*.txt; do
            grep -qE '<<< (FAILURE|ERROR)!' "$f" || continue
            classe=$(sed -n 's/^Test set: //p' "$f" | head -1)
            # Chaque échec porte sa ligne surefire ET la ligne suivante — celle qui contient
            # l'exception et le message d'assertion, sans quoi on connaît le test qui tombe mais
            # pas pourquoi. Les « at ... » de pile sont écartés, ils ne tiennent pas dans un titre.
            while IFS= read -r ligne; do
              [ -z "$ligne" ] && continue
              trouve=1
              echo "::error title=${classe}::${ligne}"
            done < <(awk '/<<< (FAILURE|ERROR)!/ && !/^Tests run:/ {
                            ligne = $0
                            if ((getline suivante) > 0) {
                              gsub(/^[ \t]+/, "", suivante)
                              if (suivante !~ /^at /) ligne = ligne " || " suivante
                            }
                            print ligne
                          }' "$f" | head -5)
          done
          if [ "$trouve" = "0" ]; then
            echo "::error title=CI::Aucun rapport surefire en echec : l'echec precede l'execution des tests."
          fi
